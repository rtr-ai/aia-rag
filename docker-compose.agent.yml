services:
  annotation-tool-agent:
    container_name: annotation-tool-agent
    build:
      context: ./annotation-tool 
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9082:3000"
    environment:
      - HOST=0.0.0.0
      - PUBLIC_URL=/annotation-tool
    command: npm start
    networks:
      - agent

  llm-service-agent:
    container_name: llm-service-agent
    privileged: true
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9086:8000"
    environment:
      - HOST=0.0.0.0
      - OLLAMA_EMBEDDING_HOST=ollama-embedding
      - LLM_PROVIDER=openai
      - LLM_BASE_URL=${LLM_BASE_URL:?LLM_BASE_URL is not set}
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY is not set}
      - EMBEDDING_MODELS=snowflake-arctic-embed2
      - LLM_MODELS=mistral-small3.2-onprem
      - ALLOWED_ORIGINS=http://chat-dev.ki.rtr.at,https://chat-dev.ki.rtr.at
      - TEMPERATURE=0.2
      - CONTEXT_WINDOW=19000
      - PROMPT_BUFFER=4500
      - ROOT_PATH=/llm-service
      - TOP_N_CHUNKS=25
      - MATOMO_ENDPOINT=${MATOMO_ENDPOINT}
      - MATOMO_TOKEN=${MATOMO_TOKEN}
      - MATOMO_SITE_ID=${MATOMO_SITE_ID}
      - ORDER_CHUNKS_FROM_SOURCE=true
      - CAPTCHA_OVERRIDE_SECRET=${CAPTCHA_OVERRIDE_SECRET}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY}
      - FRIENDLY_CAPTCHA_SITEKEY=${FRIENDLY_CAPTCHA_SITEKEY}
      - DATASETS={"ai_act_de":"combined.json","ai_act_en":"combined_en_new.json"}
      - SYSTEM_PROMPTS_FILE=system_prompts.json
      - REINDEX_ON_STARTUP=false
    volumes:
      - /app/logs-agent:/app/logs/
      - /app/indices-agent:/app/data/indices/
      - ./data/combined.json:/app/data/combined.json
      - ./data/combined_en_new.json:/app/data/combined_en_new.json
      - ./data/system_prompts.json:/app/data/system_prompts.json
      - ./data/agent/agent_tools.json:/app/data/agent_tools.json
      - ./data/agent/agent_prompt_de.md:/app/data/agent_prompt_de.md
      - ./data/agent/agent_prompt_en.md:/app/data/agent_prompt_en.md
      - ./data/agent/agent_max_turns_de.md:/app/data/agent_max_turns_de.md
      - ./data/agent/agent_max_turns_en.md:/app/data/agent_max_turns_en.md
      - ./data/agent/search_ai_act_prompt_de.md:/app/data/search_ai_act_prompt_de.md
      - ./data/agent/search_ai_act_prompt_en.md:/app/data/search_ai_act_prompt_en.md
      - ./data/guidelines/prohibited_practices_de.json:/app/data/prohibited_practices_de.json
      - ./data/guidelines/prohibited_practices_en.json:/app/data/prohibited_practices_en.json
      - ./data/guidelines/ai_system_definition_de.json:/app/data/ai_system_definition_de.json
      - ./data/guidelines/ai_system_definition_en.json:/app/data/ai_system_definition_en.json
      - ./data/guidelines/gpai_obligations_de.json:/app/data/gpai_obligations_de.json
      - ./data/guidelines/gpai_obligations_en.json:/app/data/gpai_obligations_en.json
      - ./data/guidelines/transparency_art50_en.json:/app/data/transparency_art50_en.json
      - /sys/class/powercap:/sys/class/powercap:ro
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      - /sys/devices/system/cpu:/sys/devices/system/cpu:ro
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    networks:
      - agent
      - embedding
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  user-interface-agent:
    container_name: user-interface-agent
    build:
      context: ./user-interface
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:80"
    environment:
      - HOST=0.0.0.0 
      - LLM_ENDPOINT=/llm-service  
      - FRIENDLY_CAPTCHA_SITEKEY=${FRIENDLY_CAPTCHA_SITEKEY}
    networks:
      - agent
    depends_on:
      - llm-service-agent

networks:
  agent:
  # Network of the production deployment in /app/trunk, which runs ollama-embedding
  embedding:
    name: trunk_ollama-docker
    external: true
