name: Deploy-Agent

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh/ ;
        echo "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key ;
        chmod 600 ~/.ssh/deploy_key ;
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts ;
      shell: bash
      env:
        DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    - name: Deploy to server
      run: |
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} "mkdir -p /app/stage/trunk /app/stage/trunk.new" 
        scp -i ~/.ssh/deploy_key -r ./* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }}:/app/stage/trunk.new
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} "
          rm -r /app/stage/trunk.old
          mv /app/stage/trunk /app/stage/trunk.old && 
          mv /app/stage/trunk.new /app/stage/trunk &&
          cd /app/stage/trunk"
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} 'printf "${{ secrets.MATOMO_ENV }}" > /app/stage/trunk/.env'
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} 'printf "${{ secrets.FRIENDLYCAPTCHA_ENV }}" >> /app/stage/trunk/.env'
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} 'printf "\n${{ secrets.LLM_BASE_URL_ENV }}\n" >> /app/stage/trunk/.env'
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} 'printf "${{ secrets.LLM_API_KEY_ENV }}\n" >> /app/stage/trunk/.env'
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} "cd /app/stage/trunk && ls -lah"
      shell: bash
      env:
        DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        MATOMO_ENV: ${{ secrets.MATOMO_ENV }}
        FRIENDLYCAPTCHA_ENV: ${{ secrets.FRIENDLYCAPTCHA_ENV }}
        LLM_BASE_URL_ENV: ${{ secrets.LLM_BASE_URL_ENV }}
        LLM_API_KEY_ENV: ${{ secrets.LLM_API_KEY_ENV }}
    - name: Run docker
      run: |
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} "
        cd /app/stage/trunk &&
        mv docker-compose.yml docker-compose.prod.yml &&
        mv docker-compose.agent.yml docker-compose.yml &&
        docker container prune -f &&
        docker compose build &&
        docker compose down &&
        docker compose up -d;
        "
      shell: bash
      env:
        DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
