services:
  annotation-tool-develop:
    container_name: annotation-tool-develop
    build:
      context: ./annotation-tool 
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9081:3000"
    environment:
      - HOST=0.0.0.0
      - PUBLIC_URL=/annotation-tool
    command: npm start
    networks:
      - ollama-docker
    # depends_on:
    #   - ollama

  llm-service-develop:
    container_name: llm-service-develop
    privileged: true
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9085:8000"
    environment:
      - HOST=0.0.0.0
      - OLLAMA_HOST=ollama
      - OLLAMA_EMBEDDING_HOST=ollama-embedding
      - EMBEDDING_MODELS=snowflake-arctic-embed2
      - LLM_MODELS=mistral-small,mistral-nemo,granite3.1-dense,phi4,llama3.1:8b-instruct-fp16,mixtral:8x7b-instruct-v0.1-q2_K,gpt-oss
      - ALLOWED_ORIGINS=http://rag.ki.rtr.at,https://rag.ki.rtr.at,http://chat.ki.rtr.at,https://chat.ki.rtr.at
      - TEMPERATURE=0.2
      - CONTEXT_WINDOW=21500
      - PROMPT_BUFFER=4500
      - ROOT_PATH=/llm-service
      - TOP_N_CHUNKS=25
      - RERANK_ENABLED=true
      - RERANK_TOP_N=20
      - RERANK_MODEL_PATHS=app/models/reranker/nvidia/ai-act-finetuned,/app/models/reranker/jina/ai-act-finetuned,/app/models/reranker/jina/native,/app/models/reranker/nvidia,/app/models/reranker/qwen/Quen3-Reranker-0.6B,/app/models/reranker/bge,/app/models/reranker/mixedbread
      - RERANK_MODEL_TYPES=nvidia_cross_encoder,jina_transformers,jina_transformers,nvidia_cross_encoder,qwen_cross_encoder,bge_cross_encoder,mixedbread_cross_encoder
      - RERANK_PROJECTOR_PATHS=/app/models/reranker/jina/projector.safetensors
      - RERANK_TIMEOUT_SECONDS=300
      - RERANK_FLASH_ATTENTION=true
      - RERANK_DOCUMENT_BATCH_SIZE=16
      - RERANK_GPU_LAYERS=10
      - RERANK_JINA_CONTEXT_SIZE=4096
      - RERANK_JINA_MAX_QUERY_LENGTH=512
      - RERANK_JINA_MAX_DOC_LENGTH=2500
      - RERANK_JINA_DTYPE=auto
      - RERANK_JINA_ATTENTION=sdpa
      - RERANK_JINA_REQUIRE_CUDA=true
      - RERANK_QWEN_MAX_LENGTH=8192
      - RERANK_QWEN_DTYPE=auto
      - RERANK_QWEN_ATTENTION=sdpa
      - RERANK_BGE_MAX_LENGTH=8192
      - RERANK_BGE_DTYPE=auto
      - RERANK_BGE_ATTENTION=sdpa
      - RERANK_BGE_BATCH_SIZE=4
      - RERANK_MIXEDBREAD_MAX_LENGTH=8192
      - RERANK_MIXEDBREAD_DTYPE=auto
      - RERANK_MIXEDBREAD_ATTENTION=sdpa
      - RERANK_MIXEDBREAD_BATCH_SIZE=4
      - RERANK_NVIDIA_MAX_LENGTH=512
      - RERANK_NVIDIA_DTYPE=auto
      - RERANK_NVIDIA_ATTENTION=sdpa
      - RERANK_NVIDIA_BATCH_SIZE=1
      - RERANK_INSTRUCTIONS_FILE=rerank_instructions.json
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MATOMO_ENDPOINT=${MATOMO_ENDPOINT}
      - MATOMO_TOKEN=${MATOMO_TOKEN}
      - MATOMO_SITE_ID=${MATOMO_SITE_ID}
      - ORDER_CHUNKS_FROM_SOURCE=true
      - CAPTCHA_OVERRIDE_SECRET=${CAPTCHA_OVERRIDE_SECRET}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY}
      - FRIENDLY_CAPTCHA_SITEKEY=${FRIENDLY_CAPTCHA_SITEKEY}
      - DATASETS={"ai_act_de":"combined.json","ai_act_en":"combined_en_new.json", "data_act_de":"combined_da.json"}
      - SYSTEM_PROMPTS_FILE=system_prompts.json
    volumes:
      - /app/logs:/app/logs/
      - ./data/combined.json:/app/data/combined.json
      - ./data/combined_en_new.json:/app/data/combined_en_new.json
      - ./data/combined_da.json:/app/data/combined_da.json
      - ./data/system_prompts.json:/app/data/system_prompts.json
      - ./data/rerank_instructions.json:/app/data/rerank_instructions.json
      - /app/models/reranker:/app/models/reranker:ro
      - /sys/class/powercap:/sys/class/powercap:ro
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      - /sys/devices/system/cpu:/sys/devices/system/cpu:ro
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    gpus: all
    networks:
      - ollama-docker
    # depends_on:
    #   - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  user-interface-develop:
    container_name: user-interface-develop
    build:
      context: ./user-interface
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:80"
    environment:
      - HOST=0.0.0.0 
      - LLM_ENDPOINT=/llm-service  
      - FRIENDLY_CAPTCHA_SITEKEY=${FRIENDLY_CAPTCHA_SITEKEY}
    networks:
      - ollama-docker
    depends_on:
      - llm-service-develop

networks:
  ollama-docker:
    external: false
